document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e0153e0c-9773-45d5-a05d-b7a6614a0490\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"49d0238d-e3b4-4071-b3df-4f98ea240716\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3794cdaf-869f-433a-865a-ff6219b104f5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spectral';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d71d4535-53ce-475c-99f1-a149790ebe5f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --ink: #1A1A1A;\n    --ink-soft: #3A352E;\n    --paper: #F7F3EA;\n    --paper-deep: #EFE9DB;\n    --accent: #E8633D;\n    --accent-deep: #B84A28;\n    --muted: #8A8276;\n    --rule: #CFC6B4;\n    --serif: 'Spectral', Georgia, 'Times New Roman', serif;\n    --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;\n    --sheet-w: 11in;\n    --sheet-h: 8.5in;\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n\n  body {\n    font-family: var(--mono);\n    color: var(--ink);\n    background: #20201E;\n  }\n\n  /* ---------- Screen presentation ---------- */\n  @media screen {\n    body {\n      min-height: 100vh;\n      display: flex;\n      align-items: center;\n      justify-content: center;\n      background:\n        radial-gradient(120% 120% at 50% 0%, #2b2a27 0%, #1a1916 100%);\n      overflow: hidden;\n    }\n    .stage {\n      transform: scale(var(--fit, 1));\n      transform-origin: center center;\n    }\n    .sheet {\n      box-shadow: 0 40px 90px -30px rgba(0,0,0,0.7), 0 2px 0 rgba(255,255,255,0.04);\n    }\n  }\n\n  .stage { width: var(--sheet-w); height: var(--sheet-h); }\n\n  .sheet {\n    width: var(--sheet-w);\n    height: var(--sheet-h);\n    background: var(--paper);\n    position: relative;\n    overflow: hidden;\n  }\n\n  /* subtle paper warmth + grain-free guilloche-lite radial */\n  .sheet::before {\n    content: \"\";\n    position: absolute;\n    inset: 0;\n    background:\n      radial-gradient(80% 60% at 50% -10%, rgba(232,99,61,0.05), rgba(232,99,61,0) 60%),\n      radial-gradient(70% 70% at 50% 120%, rgba(26,26,26,0.035), rgba(26,26,26,0) 60%);\n    pointer-events: none;\n  }\n\n  /* ---------- Frame ---------- */\n  .frame {\n    position: absolute;\n    inset: 0.3in;\n    border: 1.5px solid var(--ink);\n  }\n  .frame::after {\n    content: \"\";\n    position: absolute;\n    inset: 6px;\n    border: 1px solid var(--accent);\n  }\n  .corner {\n    position: absolute;\n    width: 9px;\n    height: 9px;\n    background: var(--accent);\n    z-index: 3;\n  }\n  .corner.tl { top: calc(0.3in - 4.5px); left: calc(0.3in - 4.5px); }\n  .corner.tr { top: calc(0.3in - 4.5px); right: calc(0.3in - 4.5px); }\n  .corner.bl { bottom: calc(0.3in - 4.5px); left: calc(0.3in - 4.5px); }\n  .corner.br { bottom: calc(0.3in - 4.5px); right: calc(0.3in - 4.5px); }\n\n  /* ---------- Content grid ---------- */\n  .content {\n    position: absolute;\n    inset: 0.3in;\n    padding: 20px 56px 18px;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    text-align: center;\n    z-index: 2;\n  }\n\n  /* Header lockup */\n  .lockup {\n    display: flex;\n    align-items: center;\n    gap: 11px;\n  }\n  .botmark { display: grid; }\n  .botmark > i { display: block; }\n  .wordmark {\n    font-family: var(--mono);\n    font-weight: 700;\n    font-size: 14px;\n    letter-spacing: 0.34em;\n    color: var(--ink);\n    padding-left: 0.34em;\n  }\n  .lockup-sub {\n    margin-top: 7px;\n    font-family: var(--mono);\n    font-size: 9.5px;\n    letter-spacing: 0.46em;\n    color: var(--muted);\n    padding-left: 0.46em;\n  }\n\n  .eyebrow {\n    font-family: var(--mono);\n    font-size: 11px;\n    font-weight: 600;\n    letter-spacing: 0.5em;\n    color: var(--accent-deep);\n    padding-left: 0.5em;\n  }\n  .eyebrow-rule {\n    display: flex;\n    align-items: center;\n    gap: 14px;\n    margin-top: 14px;\n  }\n  .eyebrow-rule .ln {\n    width: 46px;\n    height: 1px;\n    background: var(--rule);\n  }\n\n  .title {\n    font-family: var(--serif);\n    font-weight: 600;\n    font-size: 52px;\n    line-height: 1.0;\n    letter-spacing: -0.01em;\n    color: var(--ink);\n    margin-top: 10px;\n    white-space: nowrap;\n  }\n  .program {\n    font-family: var(--mono);\n    font-size: 12px;\n    font-weight: 500;\n    letter-spacing: 0.4em;\n    color: var(--ink-soft);\n    margin-top: 12px;\n    padding-left: 0.4em;\n  }\n\n  .certifies {\n    font-family: var(--mono);\n    font-size: 12px;\n    letter-spacing: 0.28em;\n    color: var(--muted);\n    margin-top: 16px;\n    padding-left: 0.28em;\n  }\n  .recipient {\n    font-family: var(--serif);\n    font-weight: 600;\n    font-style: italic;\n    font-size: 40px;\n    line-height: 1.05;\n    color: var(--ink);\n    margin-top: 12px;\n    padding: 0 20px 7px;\n    border-bottom: 1.5px solid var(--ink);\n    min-width: 420px;\n  }\n  .statement {\n    font-family: var(--serif);\n    font-weight: 400;\n    font-size: 15px;\n    line-height: 1.6;\n    color: var(--ink-soft);\n    max-width: 700px;\n    margin-top: 12px;\n    text-wrap: pretty;\n  }\n  .statement b { font-weight: 600; color: var(--ink); }\n\n  /* Competencies */\n  .comp {\n    width: 100%;\n    margin-top: 14px;\n  }\n  .comp-head {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 14px;\n    font-family: var(--mono);\n    font-size: 10px;\n    font-weight: 600;\n    letter-spacing: 0.42em;\n    color: var(--accent-deep);\n    padding-left: 0.42em;\n  }\n  .comp-head .ln { flex: 1; height: 1px; background: var(--rule); max-width: 150px; }\n  .comp-grid {\n    display: grid;\n    grid-template-columns: repeat(5, 1fr);\n    margin-top: 16px;\n  }\n  .comp-cell {\n    padding: 0 16px;\n    text-align: left;\n    border-left: 1px solid var(--rule);\n  }\n  .comp-cell:first-child { border-left: none; }\n  .comp-num {\n    font-family: var(--mono);\n    font-size: 11px;\n    font-weight: 700;\n    color: var(--accent);\n    letter-spacing: 0.1em;\n  }\n  .comp-title {\n    font-family: var(--mono);\n    font-size: 11px;\n    font-weight: 700;\n    color: var(--ink);\n    letter-spacing: 0.02em;\n    margin-top: 7px;\n    line-height: 1.3;\n    text-transform: uppercase;\n  }\n  .comp-desc {\n    font-family: var(--mono);\n    font-size: 9.5px;\n    font-weight: 400;\n    color: var(--muted);\n    line-height: 1.55;\n    margin-top: 8px;\n  }\n\n  /* Bottom zone */\n  .bottom {\n    width: 100%;\n    margin-top: auto;\n    padding-top: 12px;\n    display: grid;\n    grid-template-columns: 1fr auto;\n    align-items: flex-end;\n    gap: 30px;\n  }\n  .sig-col { display: flex; gap: 22px; justify-content: space-between; flex: 1; }\n  .sig {\n    text-align: center;\n    flex: 1;\n    max-width: 200px;\n  }\n  .sig-mark {\n    font-family: var(--serif);\n    font-style: italic;\n    font-size: 22px;\n    color: var(--ink);\n    height: 30px;\n    display: flex;\n    align-items: flex-end;\n    justify-content: center;\n    padding-bottom: 4px;\n    opacity: 0.85;\n  }\n  .sig-line { height: 1.5px; background: var(--ink); }\n  .sig-name {\n    font-family: var(--mono);\n    font-size: 10px;\n    font-weight: 700;\n    letter-spacing: 0.12em;\n    color: var(--ink);\n    margin-top: 8px;\n    text-transform: uppercase;\n  }\n  .sig-role {\n    font-family: var(--mono);\n    font-size: 9px;\n    letter-spacing: 0.1em;\n    color: var(--muted);\n    margin-top: 3px;\n    text-transform: uppercase;\n    line-height: 1.4;\n  }\n\n  /* Seal */\n  .seal { width: 138px; height: 138px; position: relative; }\n\n  /* Footer baseline */\n  .footer {\n    width: 100%;\n    margin-top: 14px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    border-top: 1px solid var(--rule);\n    padding-top: 9px;\n    z-index: 2;\n  }\n  .meta { display: flex; align-items: baseline; gap: 9px; }\n  .meta-k {\n    font-family: var(--mono);\n    font-size: 8.5px;\n    font-weight: 700;\n    letter-spacing: 0.18em;\n    color: var(--muted);\n    text-transform: uppercase;\n  }\n  .meta-v {\n    font-family: var(--mono);\n    font-size: 10.5px;\n    font-weight: 600;\n    color: var(--ink);\n    letter-spacing: 0.03em;\n  }\n  .meta-sep { width: 1px; height: 12px; background: var(--rule); }\n  .footer-mid { display: flex; gap: 26px; }\n\n  /* ---------- Print ---------- */\n  @media print {\n    @page { size: 11in 8.5in; margin: 0; }\n    body { background: #fff; display: block; }\n    .stage { transform: none !important; }\n    .sheet { box-shadow: none; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <div class=\"stage\" id=\"stage\">\n    \n    <div class=\"sheet\" data-screen-label=\"Certificate\">\n      <div class=\"frame\"><\u002Fdiv>\n      <div class=\"corner tl\"><\u002Fdiv>\n      <div class=\"corner tr\"><\u002Fdiv>\n      <div class=\"corner bl\"><\u002Fdiv>\n      <div class=\"corner br\"><\u002Fdiv>\n\n      <div class=\"content\">\n        <!-- Header lockup -->\n        <div class=\"lockup\">\n          <div class=\"botmark\" id=\"botmark\"><\u002Fdiv>\n          <div class=\"wordmark\">CLAUDE&nbsp;CODE&nbsp;QUEST<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"lockup-sub\">OPERATOR CERTIFICATION PROGRAM<\u002Fdiv>\n\n        <!-- Title -->\n        <div class=\"eyebrow-rule\">\n          <span class=\"ln\"><\u002Fspan>\n          <span class=\"eyebrow\">CERTIFICATE OF COMPLETION<\u002Fspan>\n          <span class=\"ln\"><\u002Fspan>\n        <\u002Fdiv>\n        <h1 class=\"title\">Certified Operator<\u002Fh1>\n        <div class=\"program\">CLAUDE CODE QUEST · CORE CURRICULUM<\u002Fdiv>\n\n        <!-- Recipient -->\n        <div class=\"certifies\">THIS CERTIFIES THAT<\u002Fdiv>\n        <div class=\"recipient\">{{RECIPIENT_NAME}}<\u002Fdiv>\n        <p class=\"statement\">\n          has successfully completed the <b>Claude Code Quest<\u002Fb> curriculum and passed all\n          required level assessments, satisfying the standard for the <b>Certified Operator<\u002Fb>\n          credential and demonstrating proficiency across the competency areas listed below.\n        <\u002Fp>\n\n        <!-- Competencies -->\n        <div class=\"comp\">\n          <div class=\"comp-head\">\n            <span class=\"ln\"><\u002Fspan>\n            COMPETENCIES CERTIFIED\n            <span class=\"ln\"><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"comp-grid\">\n            <div class=\"comp-cell\">\n              <div class=\"comp-num\">01<\u002Fdiv>\n              <div class=\"comp-title\">Core Workflows<\u002Fdiv>\n              <div class=\"comp-desc\">Permission modes, feature building, deploying solutions<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"comp-cell\">\n              <div class=\"comp-num\">02<\u002Fdiv>\n              <div class=\"comp-title\">Context &amp; Memory<\u002Fdiv>\n              <div class=\"comp-desc\">CLAUDE.md, auto-memory, context-window management<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"comp-cell\">\n              <div class=\"comp-num\">03<\u002Fdiv>\n              <div class=\"comp-title\">Customization<\u002Fdiv>\n              <div class=\"comp-desc\">Custom commands, hooks, permission modes<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"comp-cell\">\n              <div class=\"comp-num\">04<\u002Fdiv>\n              <div class=\"comp-title\">MCP &amp; Integrations<\u002Fdiv>\n              <div class=\"comp-desc\">Connecting tools, security considerations<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"comp-cell\">\n              <div class=\"comp-num\">05<\u002Fdiv>\n              <div class=\"comp-title\">Multi-Agent &amp; Advanced<\u002Fdiv>\n              <div class=\"comp-desc\">Sub-agents, background agents, routines<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Bottom: signatures · seal -->\n        <div class=\"bottom\">\n          <div class=\"sig-col\">\n            <div class=\"sig\">\n              <div class=\"sig-mark\">C. Seale<\u002Fdiv>\n              <div class=\"sig-line\"><\u002Fdiv>\n              <div class=\"sig-name\">Connor Seale<\u002Fdiv>\n              <div class=\"sig-role\">Program Director<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"sig\">\n              <div class=\"sig-mark\">G. Tapos<\u002Fdiv>\n              <div class=\"sig-line\"><\u002Fdiv>\n              <div class=\"sig-name\">Gustavo Tapos<\u002Fdiv>\n              <div class=\"sig-role\">Curriculum Director<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"sig\">\n              <div class=\"sig-mark\">C. Arana<\u002Fdiv>\n              <div class=\"sig-line\"><\u002Fdiv>\n              <div class=\"sig-name\">Christopher Arana<\u002Fdiv>\n              <div class=\"sig-role\">Director, Learning &amp; Engagement<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"seal\" id=\"seal\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Footer baseline (inside frame) -->\n        <div class=\"footer\">\n          <div class=\"meta\">\n            <span class=\"meta-k\">Issued<\u002Fspan>\n            <span class=\"meta-v\">{{ISSUE_DATE}}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"footer-mid\">\n            <div class=\"meta\">\n              <span class=\"meta-k\">Valid Through<\u002Fspan>\n              <span class=\"meta-v\">{{EXPIRATION_DATE}}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"meta-sep\"><\u002Fdiv>\n            <div class=\"meta\">\n              <span class=\"meta-k\">Credential ID<\u002Fspan>\n              <span class=\"meta-v\">{{CREDENTIAL_ID}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"meta\">\n            <span class=\"meta-k\">Credentials valid one year from issue<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script>\n  // ---- Pixel bot mark ----\n  // 7x7: 1 = ink, 2 = accent (eyes), 0 = transparent\n  // Terracotta pixel creature: 1 = orange body, 2 = black eyes, 0 = transparent\n  const BOT = [\n    \"..11111..\",\n    \"..12121..\",\n    \"..11111..\",\n    \"111111111\",\n    \"111111111\",\n    \"..11111..\",\n    \"..11111..\",\n    \"..1.1.1..\",\n  ];\n  const BOT_COLS = BOT[0].length, BOT_ROWS = BOT.length;\n  function paintBot(el, cell) {\n    const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();\n    const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();\n    el.style.gridTemplateColumns = `repeat(${BOT_COLS}, ${cell}px)`;\n    el.style.gridTemplateRows = `repeat(${BOT_ROWS}, ${cell}px)`;\n    el.innerHTML = '';\n    BOT.forEach(row => {\n      for (const ch of row) {\n        const i = document.createElement('i');\n        i.style.width = cell + 'px';\n        i.style.height = cell + 'px';\n        i.style.background = ch === '1' ? accent : ch === '2' ? ink : 'transparent';\n        el.appendChild(i);\n      }\n    });\n  }\n  paintBot(document.getElementById('botmark'), 3.5);\n\n  // ---- Seal (SVG: ring, circular text, center bot mark) ----\n  (function buildSeal(){\n    const seal = document.getElementById('seal');\n    const ink = '#1A1A1A', accent = '#E8633D', paper = '#F7F3EA';\n    const svgns = 'http://www.w3.org/2000/svg';\n    const svg = document.createElementNS(svgns,'svg');\n    svg.setAttribute('viewBox','0 0 200 200');\n    svg.setAttribute('width','138'); svg.setAttribute('height','138');\n    svg.innerHTML = `\n      <defs>\n        <path id=\"sealText\" d=\"M100,100 m-74,0 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0\" />\n      <\u002Fdefs>\n      <circle cx=\"100\" cy=\"100\" r=\"92\" fill=\"none\" stroke=\"${ink}\" stroke-width=\"2\"/>\n      <circle cx=\"100\" cy=\"100\" r=\"84\" fill=\"none\" stroke=\"${accent}\" stroke-width=\"1.5\"/>\n      <circle cx=\"100\" cy=\"100\" r=\"58\" fill=\"none\" stroke=\"${ink}\" stroke-width=\"1\"/>\n      <text font-family=\"'JetBrains Mono', monospace\" font-size=\"11.5\" font-weight=\"700\" letter-spacing=\"2.4\" fill=\"${ink}\">\n        <textPath href=\"#sealText\" startOffset=\"0%\">CLAUDE CODE QUEST · CERTIFIED OPERATOR · <\u002FtextPath>\n      <\u002Ftext>\n    `;\n    // tick marks ring\n    for (let a=0; a<360; a+=15){\n      const r1=70, r2=76, rad=a*Math.PI/180;\n      const x1=100+r1*Math.cos(rad), y1=100+r1*Math.sin(rad);\n      const x2=100+r2*Math.cos(rad), y2=100+r2*Math.sin(rad);\n      const ln = document.createElementNS(svgns,'line');\n      ln.setAttribute('x1',x1); ln.setAttribute('y1',y1);\n      ln.setAttribute('x2',x2); ln.setAttribute('y2',y2);\n      ln.setAttribute('stroke', a%45===0?accent:ink);\n      ln.setAttribute('stroke-width', a%45===0?'2':'1');\n      svg.appendChild(ln);\n    }\n    seal.appendChild(svg);\n    // center pixel bot\n    const center = document.createElement('div');\n    center.style.cssText = 'position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); display:grid;';\n    paintBot(center, 6);\n    seal.appendChild(center);\n    // \"2026\" centered below the icon\n    const tag = document.createElement('div');\n    tag.textContent = '2026';\n    tag.style.cssText = \"position:absolute; left:50%; top:68%; transform:translateX(-50%); font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:0.18em; color:\"+accent+\";\";\n    seal.appendChild(tag);\n  })();\n\n  // ---- Screen fit-to-viewport scaling ----\n  function fit(){\n    const W = 11 * 96, H = 8.5 * 96; // px at 96dpi\n    const pad = 0.92;\n    const s = Math.min(window.innerWidth / W, window.innerHeight / H) * pad;\n    document.documentElement.style.setProperty('--fit', s.toFixed(4));\n  }\n  if (matchMedia('screen').matches) {\n    fit();\n    window.addEventListener('resize', fit);\n  }\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
